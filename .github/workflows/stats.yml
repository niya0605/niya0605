name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Update stats
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats images
        uses: jstrieb/github-stats@master
        with:
          username: niya0605
          access_token: ${{ secrets.ACCESS_TOKEN }}
